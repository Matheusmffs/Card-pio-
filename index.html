<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurante FERREIRA — Cardápio e pedidos</title>
<meta name="description" content="Comida caseira feita com carinho. Veja o cardápio e faça seu pedido online.">
<meta name="theme-color" content="#7d2410">
<meta property="og:type" content="website">
<meta property="og:title" content="Restaurante FERREIRA — Cardápio e pedidos">
<meta property="og:description" content="Comida caseira feita com carinho. Peça online pelo cardápio.">
<meta property="og:image" content="https://matheusmffs.github.io/Card-pio-/logo.jpg">
<meta property="og:url" content="https://matheusmffs.github.io/Card-pio-/">
<meta name="twitter:card" content="summary">
<style>
:root{--bg:#faf7f2;--fg:#231f1a;--card:#fff;--line:#e6dfd3;--acc:#b4361c;--hero:#7d2410}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--fg:#efe9df;--card:#221e17;--line:#3a3328;--acc:#d9532e;--hero:#4a1a0d}}
*{box-sizing:border-box}
body{font-family:system-ui,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg);padding-bottom:90px}
h1,h2{font-family:Georgia,'Times New Roman',serif}
.hero{background:var(--hero);color:#fff;padding:28px 16px 22px;text-align:center}
.logo{width:124px;height:124px;border-radius:20px;border:2px solid #d9a441;object-fit:contain;background:#000;display:block;margin:0 auto 10px}
.ini{display:flex;align-items:center;justify-content:center;font:700 2.4rem Georgia,serif;color:#d9a441}
.hero h1{margin:0;font-size:1.7rem}.hero p{margin:6px 0 0;opacity:.9}
.hero a{display:inline-block;margin-top:12px;color:#fff;border:1px solid #fff9;border-radius:20px;padding:6px 14px;text-decoration:none;font-size:.9rem}
#cn{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
#cn a{white-space:nowrap;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:.92rem}
#cn a:hover{border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:4px 16px}
h2{margin:26px 0 10px;font-size:1.3rem;scroll-margin-top:64px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.it{display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden}
.tx{display:flex;flex-direction:column;justify-content:space-between;min-width:0;flex:1}
.tx h3{margin:0 0 4px;font-size:1.02rem}.tx p{margin:0 0 8px;opacity:.75;font-size:.88rem;line-height:1.35}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pr{font-weight:700;font-size:1.05rem}
.ph{width:112px;height:112px;flex:none;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:#fff;cursor:pointer}
.q{display:flex;align-items:center;gap:10px}.q button{width:36px;padding:7px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,#cn a:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
label{display:block;margin-top:10px;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.sec{background:#6b7280}.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ck{display:flex;align-items:center;gap:8px}.ck input{width:auto;margin:0}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:20px;background:#0007;font-weight:600;font-size:.95rem}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;animation:pu 2s infinite}
.dot.warn{background:#f59e0b;animation:none}.dot.off{background:#ef4444;animation:none}
@keyframes pu{0%{box-shadow:0 0 0 0 #22c55eaa}70%,100%{box-shadow:0 0 0 8px #22c55e00}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
#hrs{margin-top:10px;font-size:.9rem}#hrs summary{cursor:pointer;opacity:.9;text-decoration:underline}
#hl{list-style:none;margin:8px auto 0;padding:0;max-width:300px;text-align:left}
#hl li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;opacity:.85}
#hl li.hoje{font-weight:700;opacity:1;color:#f5c26b}
.cl{padding:12px 14px;margin:14px 0 0;background:var(--card);border:1px solid #ef4444;border-radius:12px;font-size:.95rem}
button:disabled{opacity:.45;cursor:not-allowed}
.mode{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}#fee{font-size:.9rem;font-weight:600;margin-top:8px;min-height:1.2em}#pk{margin-top:12px;font-size:.9rem;opacity:.85}
footer{text-align:center;opacity:.6;font-size:.85rem;padding:24px 16px}
</style>
</head>
<body>
<header class="hero">
  <div id="lg"></div><h1 id="st"></h1><p id="tg"></p>
  <div id="hs" class="badge" role="status"></div>
  <details id="hrs"><summary>Ver horários de funcionamento</summary><ul id="hl"></ul></details><a id="wa" class="hidden" target="_blank" rel="noopener">Falar no WhatsApp</a>
</header>
<nav id="cn" aria-label="Categorias"></nav>
<main id="menu"><p>Carregando cardápio…</p></main>
<footer id="ft"></footer>
<div id="bar" class="hidden"><span id="bt"></span><button onclick="openCk()">Ver pedido</button></div>

<div id="ck" class="ov hidden" role="dialog" aria-modal="true">
  <form class="box" id="ckf" onsubmit="send(event)">
    <h2 style="margin-top:0">Seu pedido</h2>
    <div id="sum"></div>
    <label>Nome<input id="c_n" required autocomplete="name"></label>
    <label>Telefone / WhatsApp<input id="c_p" required type="tel" autocomplete="tel"></label>
    <div class="mode" role="radiogroup" aria-label="Como receber o pedido">
      <label class="ck"><input type="radio" name="md" value="entrega" checked onchange="setMode(this.value)"> 🛵 Entrega</label>
      <label class="ck"><input type="radio" name="md" value="retirada" onchange="setMode(this.value)"> 🛍️ Retirar no local</label>
    </div>
    <div id="adr">
    <label>CEP<input id="c_cep" required inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" oninput="cepLookup()"></label>
    <div id="cepmsg" role="status" style="font-size:.85rem;opacity:.8;min-height:1.1em"></div>
    <label>Rua<input id="c_rua" required autocomplete="address-line1"></label>
    <div class="two"><label>Número<input id="c_num" required inputmode="numeric" placeholder="Ex.: 120"></label><label>Bairro<input id="c_bai" required></label></div>
    <label>Cidade/UF<input id="c_cid" required></label>
    <label>Ponto de referência (opcional)<input id="c_ref" placeholder="Ex.: casa azul, ao lado da padaria"></label>
    <div id="fee" role="status"></div>
    </div>
    <div id="pk" class="hidden"></div>
    <label>Pagamento<select id="c_pg" onchange="payUI()"><option>Pix</option><option>Cartão na entrega</option><option>Dinheiro</option></select></label>
    <div id="tr" class="hidden">
      <label>Troco para quanto? (R$)<input id="c_tr" type="number" min="0" step="any" inputmode="decimal" placeholder="Ex.: 50" oninput="payUI()"></label>
      <label class="ck"><input type="checkbox" id="c_nt" onchange="payUI()"> Não preciso de troco</label>
      <div id="trm" role="status" style="font-size:.9rem;font-weight:600;min-height:1.2em"></div>
    </div>
    <label>Observações<textarea id="c_o" rows="2"></textarea></label>
    <div class="acts"><button type="button" class="sec" onclick="$('ck').classList.add('hidden')">Voltar</button><button id="sb">Enviar pedido</button></div>
  </form>
</div>

const $=id=>document.getElementById(id);

async function init(){
  try{
    if(CFG.url){
      const r=await fetch(CFG.url+'/rest/v1/products?active=eq.true&select=*&order=category,name',{headers:H()});
      if(!r.ok)throw 0;P=await r.json();
    }else{ // modo demonstração: lê os produtos do painel salvo neste navegador
      P=(JSON.parse(localStorage.getItem('delivery_db'))||{products:[]}).products.map(p=>({...p,category:p.cat||'Geral',description:p.desc||'',image:p.img||''}));
    }
  }catch(e){$('menu').innerHTML='<p>Não foi possível carregar o cardápio. Tente novamente em instantes.</p>';return}
  render();
}
function card(p){
  const q=cart[p.id]||0;
  return `<article class="it"><div class="tx"><div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></div>
  <div class="ft"><span class="pr">${money(p.price)}</span>${q
    ?`<span class="q"><button aria-label="Remover um ${esc(p.name)}" onclick="chg(${p.id},-1)">−</button><b>${q}</b><button aria-label="Adicionar mais um ${esc(p.name)}" onclick="chg(${p.id},1)">+</button></span>`
    :`<button${blocked()?' disabled':''} onclick="chg(${p.id},1)" aria-label="Adicionar ${esc(p.name)}">Adicionar</button>`}</div></div>
  <div class="ph">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'<span aria-hidden="true">🍽️</span>'}</div></article>`;
}
function render(){
  if(!P.length){$('menu').innerHTML='<p>Cardápio vazio por enquanto.</p>';$('cn').classList.add('hidden');return}
  const cats=[...new Set(P.map(p=>p.category||'Geral'))];
  $('cn').innerHTML=cats.map((c,i)=>`<a href="#c${i}">${esc(c)}</a>`).join('');
  $('cn').classList.toggle('hidden',cats.length<2);
  $('menu').innerHTML=banner()+cats.map((c,i)=>`<h2 id="c${i}">${esc(c)}</h2><div class="g">`+P.filter(p=>(p.category||'Geral')===c).map(card).join('')+'</div>').join('');
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  $('bar').classList.toggle('hidden',!n);$('bt').innerHTML=`<b>${n}</b> item(ns) · <b>${money(total())}</b>`;
}
const lines=()=>P.filter(p=>cart[p.id]>0).map(p=>({p,q:cart[p.id]}));
const total=()=>lines().reduce((s,l)=>s+l.p.price*l.q,0);
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function openCk(){
  sumUI();
  $('ck').classList.remove('hidden');payUI();if(MODE==='entrega')schedFee();
}
async function send(e){
  e.preventDefault();
  if(blocked()){alert('Estamos fechados no momento. Volte no horário de atendimento.');return}
  if(MODE==='entrega'){
    if(FEEST==='idle')await calcFee();
    if(FEEST==='calc'){alert('Aguarde um instante: estamos calculando a entrega.');return}
    if(FEEST==='fora'){alert('Esse endereço está fora da nossa área de entrega. Escolha "Retirar no local" ou fale conosco.');return}
  }
  const items=lines().map(l=>({id:l.p.id,q:l.q}));if(!items.length)return;
  let pay=$('c_pg').value;
  if(pay==='Dinheiro'){
    if($('c_nt').checked)pay='Dinheiro (sem troco)';
    else{
      const v=num($('c_tr').value);
      if(!v){alert('Informe para quanto precisa de troco, ou marque "Não preciso de troco".');return}
      if(v<grand()){alert('O valor para o troco deve ser maior ou igual ao total do pedido.');return}
      pay='Dinheiro — troco para '+money(v)+' (levar '+money(v-grand())+')';
    }
  }
  const ref=$('c_ref').value.trim();
  const addr=MODE==='retirada'?'Retirada no local':$('c_rua').value.trim()+', '+$('c_num').value.trim()+' - '+$('c_bai').value.trim()+', '+$('c_cid').value.trim()+' — CEP '+$('c_cep').value.trim()+(ref?' — Ref: '+ref:'');
  const o={client:$('c_n').value.trim(),phone:$('c_p').value.trim(),address:addr,payment:pay,notes:$('c_o').value.trim(),items,mode:MODE,delivery_fee:MODE==='retirada'?0:FEE,delivery_km:MODE==='retirada'?null:KM};
  $('sb').disabled=true;
  try{
    if(CFG.url){
      const r=await fetch(CFG.url+'/rest/v1/orders',{method:'POST',headers:{...H(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(o)});
      if(!r.ok)throw 0;
    }
    const txt=`*Novo pedido — ${CFG.store}*\n`+lines().map(l=>`${l.q}× ${l.p.name}`).join('\n')+`\n${MODE==='retirada'?'Retirada no local':'Entrega: '+(FEE==null?'a confirmar':money(FEE))}\nTotal: ${money(grand())}${MODE==='entrega'&&FEE==null?' + taxa de entrega':''}\nPagamento: ${o.payment}\nCliente: ${o.client} (${o.phone})\n${MODE==='retirada'?'Cliente vai retirar no local':'Endereço: '+o.address}`+(o.notes?`\nObs: ${o.notes}`:'');
    cart={};$('ck').classList.add('hidden');render();
    if(CFG.whats)window.open('https://wa.me/'+CFG.whats+'?text='+encodeURIComponent(txt),'_blank');
    alert('Pedido enviado! Obrigado.');
  }catch(err){alert('Não foi possível enviar o pedido. Tente novamente.')}
  $('sb').disabled=false;
}
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
function payUI(){
  const din=$('c_pg').value==='Dinheiro';$('tr').classList.toggle('hidden',!din);
  const nt=$('c_nt').checked;$('c_tr').disabled=nt;
  const v=num($('c_tr').value);
  $('trm').textContent=!din||nt||!v?'':(v<grand()?'O valor deve ser maior ou igual ao total ('+money(grand())+').':'Troco a levar: '+money(v-grand()));
}
async function cepLookup(){
  const el=$('c_cep'),d=el.value.replace(/\D/g,'').slice(0,8),m=$('cepmsg');
  el.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;
  if(d.length<8){m.textContent='';return}
  m.textContent='Buscando endereço…';
  try{
    const r=await fetch('https://viacep.com.br/ws/'+d+'/json/');
    const j=await r.json();
    if(el.value.replace(/\D/g,'')!==d)return; // o cliente já mudou o CEP
    if(!r.ok||j.erro)throw 0;
    $('c_rua').value=j.logradouro||'';$('c_bai').value=j.bairro||'';$('c_cid').value=j.localidade+'/'+j.uf;
    m.textContent=j.logradouro?'Endereço encontrado. Informe o número.':'Esse CEP não tem rua cadastrada: informe a rua e o bairro.';
    (j.logradouro?$('c_num'):$('c_rua')).focus();schedFee();
  }catch(e){m.textContent='CEP não encontrado. Preencha o endereço manualmente.'}
}
/* ---------- horário de funcionamento ---------- */
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const tm=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmt=m=>{const h=Math.floor(m/60)%24,mi=m%60;return mi?h+'h'+String(mi).padStart(2,'0'):h+'h'};
function brNow(){
  const o={};new Intl.DateTimeFormat('en-US',{timeZone:CFG.tz,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
  return{d:WD.indexOf(o.weekday),m:(+o.hour)*60+(+o.minute)};
}
const shifts=d=>(CFG.hours[d]||[]).map(x=>{const [a,b]=x.split('-').map(tm);return{a,b:b<=a?b+1440:b}});
function status(){
  const n=brNow();
  for(const s of shifts(n.d))if(n.m>=s.a&&n.m<s.b)return{open:true,until:s.b%1440,rem:s.b-n.m};
  for(const s of shifts((n.d+6)%7))if(s.b>1440&&n.m<s.b-1440)return{open:true,until:s.b-1440,rem:s.b-1440-n.m}; // turno que passou da meia-noite
  for(let i=0;i<8;i++){const d=(n.d+i)%7;for(const s of shifts(d).sort((x,y)=>x.a-y.a))if(i>0||s.a>n.m)return{open:false,next:{day:i,d,at:s.a}}}
  return{open:false};
}
let ST=null;
const blocked=()=>!!(CFG.blockClosed&&ST&&!ST.open);
function nextTxt(){
  const x=ST&&ST.next;if(!x)return'';
  return 'Abrimos '+(x.day===0?'hoje':x.day===1?'amanhã':'na '+DIAS[x.d].toLowerCase())+' às '+fmt(x.at);
}
function banner(){
  return blocked()?`<div class="cl" role="status"><b>Estamos fechados no momento.</b> ${nextTxt()}. Você pode ver o cardápio, e os pedidos abrem no horário de atendimento.</div>`:'';
}
function updateStatus(){
  const prev=ST?ST.open:null;ST=status();
  let t,c='';
  if(ST.open){if(ST.rem<=30){c='warn';t='Fecha em '+ST.rem+' min'}else t='Aberto agora · até '+fmt(ST.until)}
  else{c='off';t='Fechado'+(ST.next?' · '+nextTxt().replace('Abrimos','abre').replace('na ',''):'')}
  $('hs').innerHTML='<span class="dot '+c+'" aria-hidden="true"></span><span>'+esc(t)+'</span>';
  const hoje=brNow().d;
  $('hl').innerHTML=[1,2,3,4,5,6,0].map(d=>`<li${d===hoje?' class="hoje"':''}><span>${DIAS[d]}</span><span>${(CFG.hours[d]||[]).length?CFG.hours[d].map(x=>x.split('-').map(y=>fmt(tm(y))).join(' às ')).join(' e '):'Fechado'}</span></li>`).join('');
  if(prev!==null&&prev!==ST.open&&P.length)render();
}
/* ---------- entrega por km e retirada ---------- */
let MODE='entrega',FEE=null,KM=null,FEEST='idle',calcSeq=0,tmr;
const grand=()=>total()+(MODE==='entrega'&&FEE?FEE:0);
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const feeFor=(km,sub)=>{const D=CFG.delivery;if(D.freeAbove>0&&sub>=D.freeAbove)return 0;if(km<=D.freeKm)return 0;const f=km<=D.flatKm?D.flatFee:D.flatFee+(km-D.flatKm)*D.perKm;return Math.ceil(f/D.round-1e-9)*D.round};
const GEO={};
async function geocode(q){ // OpenStreetMap (gratuito, sem chave)
  if(q in GEO)return GEO[q];
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q));const j=await r.json();GEO[q]=j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){GEO[q]=null}
  return GEO[q];
}
function sumUI(){
  const row=(a,b)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${b}</span></div>`;
  const fl=MODE==='retirada'?'Grátis':({idle:'informe o endereço',calc:'calculando…',ok:FEE===0?'Grátis':money(FEE),pending:'a confirmar',fora:'—'})[FEEST];
  $('sum').innerHTML=lines().map(l=>row(l.q+'× '+esc(l.p.name),money(l.p.price*l.q))).join('')+'<hr>'+row('Subtotal',money(total()))+row(MODE==='retirada'?'Retirada no local':'Entrega',fl)
    +`<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:6px"><span>Total</span><span>${money(grand())}</span></div>`;
}
function setFee(st,fee=null,km=null,msg=''){FEEST=st;FEE=fee;KM=km;$('fee').textContent=msg;sumUI();payUI()}
function schedFee(){clearTimeout(tmr);FEEST='idle';FEE=null;KM=null;sumUI();tmr=setTimeout(calcFee,900)}
async function calcFee(){
  if(MODE!=='entrega')return;
  const D=CFG.delivery,rua=$('c_rua').value.trim(),n=$('c_num').value.trim(),bai=$('c_bai').value.trim(),[cid,uf]=$('c_cid').value.split('/').map(x=>x.trim());
  if(!rua||!n||!cid)return setFee('idle');
  const my=++calcSeq;setFee('calc',null,null,'Calculando a taxa de entrega…');
  const O=(D.origin&&D.origin.lat!=null)?D.origin:(D.originAddress?await geocode(D.originAddress+', Brasil'):null);
  if(my!==calcSeq)return;
  if(!O)return setFee('pending',null,null,'A taxa de entrega será confirmada pelo restaurante.');
  let pt=await geocode([rua,n,bai,cid,uf,'Brasil'].filter(Boolean).join(', '));
  if(!pt){await new Promise(r=>setTimeout(r,1100));pt=await geocode([rua,bai,cid,uf,'Brasil'].filter(Boolean).join(', '))}
  if(my!==calcSeq)return;
  if(!pt)return setFee('pending',null,null,'Não conseguimos calcular a distância. A taxa será confirmada pelo restaurante.');
  const km=Math.round(hav(O,pt)*10)/10,kt=km.toLocaleString('pt-BR');
  if(km>D.maxKm)return setFee('fora',null,km,'Esse endereço fica a cerca de '+kt+' km, fora da nossa área de entrega (até '+D.maxKm+' km). Você pode escolher "Retirar no local".');
  const fee=feeFor(km*D.roadFactor,total());
  setFee('ok',fee,km,'Distância aproximada: '+kt+' km · Entrega: '+(fee===0?'grátis':money(fee)));
}
function setMode(m){
  MODE=m;$('adr').classList.toggle('hidden',m!=='entrega');
  ['c_cep','c_rua','c_num','c_bai','c_cid'].forEach(id=>$(id).required=(m==='entrega'));
  const pk=$('pk');pk.classList.toggle('hidden',m!=='retirada');
  pk.textContent='Retirada no local, sem taxa de entrega.'+(CFG.pickupAddress?' Endereço: '+CFG.pickupAddress:'');
  if(m==='entrega')schedFee();else{sumUI();payUI()}
}
['c_rua','c_num','c_bai','c_cid'].forEach(id=>$(id).addEventListener('input',schedFee));
updateStatus();setInterval(updateStatus,60000);
init();
</script>
