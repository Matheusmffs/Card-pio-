<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Delivery</title>
<style>
:root{--bg:#f4f5f7;--fg:#222;--card:#fff;--line:#ddd;--head:#15181d;--acc:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e8;--card:#1f2228;--line:#333844;--head:#0b0c0f}}
*{box-sizing:border-box}
body{font-family:system-ui,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
header{background:var(--head);color:#fff;padding:16px;display:flex;justify-content:space-between}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--card)}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:var(--acc);color:#fff;font:inherit}
button.sec{background:#6b7280}
nav button{background:var(--bg);color:var(--fg)}
nav button.on{background:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px}
.hidden{display:none!important}
input,select{padding:10px;margin:4px 0;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
label{display:block;margin-top:8px;font-size:.9rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card)}
td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.ov .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.row{display:flex;gap:6px;align-items:center}
.row .x{padding:10px}
.empty{padding:16px;text-align:center;opacity:.7}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fbar label{margin:0;flex:1;min-width:150px}
.chip{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:6px 10px}
.kpi b{font-size:1.5rem;display:block;margin-top:4px}.kpi small{display:block;margin-top:2px;opacity:.85}
.up{color:#16a34a}.dn{color:#dc2626}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.charts .card{margin:0}
.charts .wide{grid-column:1/-1}
.ch{width:100%;height:auto}.gl{stroke:var(--line)}.tx{fill:currentColor;font-size:11px;opacity:.7}
.b1{fill:var(--acc)}.b2{fill:#6b7280}.bg{cursor:pointer}.bg:hover .b1{opacity:.8}.sel .b1{stroke:var(--fg);stroke-width:1.5}
.dim{opacity:.35}
.hb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:8px 0;cursor:pointer;font-size:.9rem}
.st .hb{cursor:default}.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--acc)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 12px}
</style>
</head>
<body>
<header><b>🍱 Sistema de Delivery</b><span id="user"></span></header>

<div id="login" class="card" style="max-width:380px;margin:50px auto">
  <h2>Login</h2>
  <label for="lu">Usuário</label><input id="lu" autocomplete="username">
  <label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password">
  <div class="acts"><button onclick="login()">Entrar</button></div>
  <p>Demo: admin / 1234</p>
</div>

<div id="app" class="hidden">
  <nav id="nav">
    <button data-p="dash">Dashboard</button><button data-p="sales">Vendas</button>
    <button data-p="buy">Compras</button><button data-p="stock">Estoque</button>
    <button data-p="prod">Produtos</button><button data-p="recipe">Ficha técnica</button>
    <button data-p="online">Online</button><button data-p="report">Relatórios</button><button class="sec" onclick="logout()">Sair</button>
  </nav>
  <main id="content"></main>
</div>

<div id="md" class="ov hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h3 id="mt"></h3><div id="mb"></div>
    <div class="acts"><button id="mok">Salvar</button><button class="sec" onclick="closeM()">Cancelar</button></div>
  </div>
</div>
<input type="file" id="imp" accept="application/json" class="hidden">

<script>
const K='delivery_db';
// SHA-256 de "1234". Atenção: continua sendo um login apenas de demonstração (roda no navegador).
const PH='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const qfmt=n=>(Math.round(n*1000)/1000).toLocaleString('pt-BR');
const empty=()=>({ingredients:[],products:[],purchases:[],sales:[],recipes:[]});

function load(){
  let d;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
  d=Object.assign(empty(),d||{});
  // migração: fichas antigas usavam nomes; agora usam ids
  d.recipes.forEach(r=>{
    if(r.pid==null){const p=d.products.find(x=>x.name===r.product);r.pid=p?p.id:null}
    r.items.forEach(i=>{if(i.id==null){const g=d.ingredients.find(x=>x.name===i.name);i.id=g?g.id:null}});
  });
  return d;
}
let db=load();
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Não foi possível salvar. Verifique o espaço do navegador e exporte um backup.')}}

/* ---------- login ---------- */
async function sha(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function login(){
  if(!crypto.subtle)return alert('Abra o sistema em https ou localhost para fazer login.');
  if($('lu').value==='admin'&&await sha($('lp').value)===PH){sessionStorage.x=1;enter()}
  else alert('Login inválido');
}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent='admin';show('dash')}
function logout(){sessionStorage.clear();location.reload()}
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('nav').addEventListener('click',e=>{const p=e.target.dataset.p;if(p)show(p)});

/* ---------- modal e linhas dinâmicas ---------- */
let ROW={};
function modal(title,body,onOk){
  $('mt').textContent=title;$('mb').innerHTML=body;$('md').classList.remove('hidden');
  $('mok').onclick=()=>{if(onOk()!==false)closeM()};
  const f=$('mb').querySelector('input,select');if(f)f.focus();
}
function closeM(){$('md').classList.add('hidden')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const opts=(arr,fn)=>arr.map(x=>`<option value="${x.id}">${esc(fn?fn(x):x.name)}</option>`).join('');
function rowsUI(o,qLabel,vLabel){
  ROW={o,qLabel,vLabel};
  return `<div id="rows"></div><div class="acts"><button type="button" class="sec" onclick="addRow()">+ Item</button></div>`;
}
function addRow(){
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<select class="s" aria-label="Item">${ROW.o}</select>
  <input class="q" type="number" min="0" step="any" placeholder="${ROW.qLabel}" aria-label="${ROW.qLabel}">
  ${ROW.vLabel?`<input class="v" type="number" min="0" step="any" placeholder="${ROW.vLabel}" aria-label="${ROW.vLabel}">`:''}
  <button type="button" class="sec x" aria-label="Remover" onclick="this.parentNode.remove()">✕</button>`;
  $('rows').appendChild(d);
}
function getRows(){
  return [...document.querySelectorAll('#rows .row')].map(r=>({
    id:+r.querySelector('.s').value,q:num(r.querySelector('.q').value),
    v:r.querySelector('.v')?num(r.querySelector('.v').value):0
  })).filter(r=>r.q>0);
}
const tbl=(head,rows,msg)=>rows.length
  ?`<div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`
  :`<div class="card empty">${msg}</div>`;

/* ---------- telas ---------- */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function show(p){
  document.querySelectorAll('#nav button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const fn={dash,sales,buy,stock,prod,recipe,online,report}[p];
  $('content').innerHTML=fn();
}
/* dashboard interativo: filtros + clique nos gráficos filtra os demais (como no Power BI) */
const F={per:'30',prod:'',day:''};
const pd=s=>{const [d,m,y]=String(s).split('/').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const short=n=>n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':String(Math.round(n));
const fdate=k=>k.split('-').reverse().join('/');
function cost1(name){
  const p=db.products.find(x=>x.name===name),r=p&&db.recipes.find(x=>x.pid===p.id);
  return r?sum(r.items,it=>{const g=db.ingredients.find(x=>x.id===it.id);return it.q*(g?g.cost:0)}):0;
}
function saleLines(){
  const out=[];
  db.sales.forEach((s,n)=>{
    const d=pd(s.date);
    if(s.items&&s.items.length)s.items.forEach(i=>{const p=db.products.find(x=>x.name===i.name);
      out.push({n,d,name:i.name,rev:i.q*(i.p??(p?p.price:0)),cost:i.q*cost1(i.name)})});
    else out.push({n,d,name:'(sem itens)',rev:s.total,cost:0});
  });
  return out;
}
function span(){
  if(F.per==='all')return null;
  const n=+F.per,t=new Date();t.setHours(0,0,0,0);
  const s=new Date(t);s.setDate(s.getDate()-(n-1));
  const pe=new Date(s);pe.setDate(pe.getDate()-1);
  const ps=new Date(pe);ps.setDate(ps.getDate()-(n-1));
  return{s,e:t,ps,pe,n};
}
const hb=(arr,attr,sel)=>{
  const m=Math.max(1,...arr.map(a=>a[1]));
  return arr.length?arr.map(([k,v])=>`<div class="hb${sel&&sel!==k?' dim':''}" ${attr}="${esc(k)}" title="${esc(k)}"><span class="hl">${esc(k)}</span><span class="hbar"><i style="width:${Math.max(v,0)/m*100}%"></i></span><b>${money(v)}</b></div>`).join(''):'<div class="empty">Sem dados neste filtro.</div>';
};
function dash(){
  const sp=span(),L=saleLines(),P=db.purchases.map(x=>({d:pd(x.date),v:x.total}));
  const rg=d=>!sp||(d>=sp.s&&d<=sp.e);
  const pf=l=>!F.prod||l.name===F.prod,df=d=>!F.day||iso(d)===F.day;
  const cur=L.filter(l=>rg(l.d));
  const K=cur.filter(l=>pf(l)&&df(l.d));
  const rev=sum(K,l=>l.rev),cst=sum(K,l=>l.cost),ord=new Set(K.map(l=>l.n)).size;
  const comp=sum(P.filter(p=>rg(p.d)&&df(p.d)),p=>p.v),lucro=rev-cst;
  let delta='';
  if(sp&&!F.day){
    const pr=sum(L.filter(l=>pf(l)&&l.d>=sp.ps&&l.d<=sp.pe),l=>l.rev);
    if(pr){const d=(rev-pr)/pr*100;delta=`<small class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}% vs período anterior</small>`}
  }
  // série diária (ignora o filtro de dia, respeita o de produto)
  const days=[];
  if(sp){for(let i=0;i<sp.n;i++){const d=new Date(sp.s);d.setDate(d.getDate()+i);days.push(iso(d))}}
  else days.push(...[...new Set([...L.map(l=>iso(l.d)),...P.map(p=>iso(p.d))])].sort());
  const vs={},cs={};
  cur.filter(pf).forEach(l=>{const k=iso(l.d);vs[k]=(vs[k]||0)+l.rev});
  P.filter(p=>rg(p.d)).forEach(p=>{const k=iso(p.d);cs[k]=(cs[k]||0)+p.v});
  const W=640,H=230,X0=46,B0=26,T0=10,mx=Math.max(1,...days.map(d=>Math.max(vs[d]||0,cs[d]||0)));
  const bw=(W-X0)/Math.max(days.length,1),h=v=>v/mx*(H-B0-T0);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Vendas e compras por dia">`;
  [0,.5,1].forEach(t=>{const y=H-B0-t*(H-B0-T0);svg+=`<line x1="${X0}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${X0-6}" y="${y+4}" text-anchor="end" class="tx">${short(mx*t)}</text>`});
  days.forEach((d,i)=>{
    const x=X0+i*bw,g=bw*.8,v=vs[d]||0,c=cs[d]||0,sel=F.day===d;
    svg+=`<g data-day="${d}" class="bg${sel?' sel':''}${F.day&&!sel?' dim':''}"><rect x="${x}" y="${T0}" width="${bw}" height="${H-B0-T0}" fill="transparent"/><rect x="${x+bw*.1}" y="${H-B0-h(v)}" width="${g/2}" height="${h(v)}" class="b1"/><rect x="${x+bw*.1+g/2}" y="${H-B0-h(c)}" width="${g/2}" height="${h(c)}" class="b2"/><title>${fdate(d)}: vendas ${money(v)} · compras ${money(c)}</title></g>`;
    if(days.length<=10||i%Math.ceil(days.length/8)===0)svg+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="tx">${d.slice(8)}/${d.slice(5,7)}</text>`;
  });
  svg+='</svg>';
  // ranking de produtos (ignora o filtro de produto, respeita o de dia)
  const pm={};cur.filter(l=>df(l.d)).forEach(l=>pm[l.name]=(pm[l.name]||0)+l.rev);
  const top=Object.entries(pm).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const stk=db.ingredients.map(i=>[i.name,i.qty*i.cost]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const zero=db.ingredients.filter(i=>i.qty<=0);
  const names=[...new Set([...db.products.map(p=>p.name),...L.map(l=>l.name)])];
  const kpi=(t,v,s='')=>`<div class="card kpi">${t}<b>${v}</b>${s}</div>`;
  return `<div class="dashroot"><h2>Dashboard</h2>
  <div class="card fbar">
    <label>Período<select onchange="F.per=this.value;F.day='';show('dash')">
      ${[['1','Hoje'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['all','Todo o período']].map(o=>`<option value="${o[0]}"${F.per===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>
    <label>Produto<select onchange="F.prod=this.value;show('dash')"><option value="">Todos</option>
      ${names.map(n=>`<option value="${esc(n)}"${F.prod===n?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
    ${F.day?`<button class="chip" onclick="F.day='';show('dash')">Dia ${fdate(F.day)} ✕</button>`:''}
    ${F.prod?`<button class="chip" onclick="F.prod='';show('dash')">${esc(F.prod)} ✕</button>`:''}
  </div>
  <p style="opacity:.7;margin:0 0 12px">Dica: clique em uma barra do gráfico ou em um produto para filtrar todo o painel.</p>
  <div class="grid" style="margin-bottom:12px">
    ${kpi('Faturamento',money(rev),delta)}${kpi('Pedidos',ord)}${kpi('Ticket médio',money(ord?rev/ord:0))}
    ${kpi('Compras',money(comp))}
    ${kpi('Lucro bruto estimado',`<span class="${lucro>=0?'up':'dn'}">${money(lucro)}</span>`,`<small>Margem ${rev?(lucro/rev*100).toFixed(0):0}% (custo pela ficha técnica)</small>`)}
    ${kpi('Valor em estoque',money(sum(db.ingredients,i=>i.qty*i.cost)),zero.length?`<small class="dn">${zero.length} item(ns) zerado(s)</small>`:'')}
  </div>
  <div class="charts">
    <div class="card wide"><b>Vendas e compras por dia</b>
      <span class="lg"><i class="b1" style="background:var(--acc)"></i>Vendas<i style="background:#6b7280"></i>Compras</span>${svg}</div>
    <div class="card"><b>Top produtos por faturamento</b>${hb(top,'data-prod',F.prod)}</div>
    <div class="card st"><b>Valor em estoque por item</b>${hb(stk,'data-i','')}</div>
  </div></div>`;
}
$('content').addEventListener('click',e=>{
  const t=e.target.closest('[data-prod],[data-day]');
  if(!t||!$('content').querySelector('.dashroot'))return;
  if(t.dataset.prod!==undefined)F.prod=F.prod===t.dataset.prod?'':t.dataset.prod;
  else F.day=F.day===t.dataset.day?'':t.dataset.day;
  show('dash');
});

/* estoque */
function stock(){
  return `<h2>Estoque</h2><div class="card"><button onclick="addIng()">+ Ingrediente/insumo</button></div>`+
  tbl(['Item','Qtd','Un.','Custo','Total'],db.ingredients.map(i=>
    `<tr><td>${esc(i.name)}</td><td${i.qty<0?' style="color:#dc2626"':''}>${qfmt(i.qty)}</td><td>${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${money(i.qty*i.cost)}</td></tr>`),
    'Nenhum ingrediente cadastrado. Use “+ Ingrediente/insumo”.');
}
function addIng(){
  modal('Novo ingrediente',`
  <label>Nome<input id="f1"></label>
  <label>Unidade<select id="f2"><option>kg</option><option>g</option><option>L</option><option>mL</option><option>un</option></select></label>
  <label>Quantidade inicial<input id="f3" type="number" min="0" step="any" value="0"></label>
  <label>Custo por unidade (R$)<input id="f4" type="number" min="0" step="any" value="0"></label>`,()=>{
    const n=$('f1').value.trim();
    if(!n){alert('Informe o nome.');return false}
    if(db.ingredients.some(i=>i.name.toLowerCase()===n.toLowerCase())){alert('Já existe um ingrediente com esse nome.');return false}
    db.ingredients.push({id:Date.now(),name:n,unit:$('f2').value,qty:num($('f3').value),cost:num($('f4').value)});
    save();show('stock');
  });
}

/* compras */
function buy(){
  return `<h2>Compras</h2><div class="card"><button onclick="addBuy()">+ Registrar compra</button></div>`+
  tbl(['Data','Fornecedor','Itens','Total'],db.purchases.map(x=>
    `<tr><td>${esc(x.date)}</td><td>${esc(x.sup)}</td><td>${x.items.map(i=>esc(i.name)+' × '+qfmt(i.q)).join(', ')}</td><td>${money(x.total)}</td></tr>`),
    'Nenhuma compra registrada.');
}
function addBuy(){
  if(!db.ingredients.length)return alert('Cadastre ingredientes primeiro.');
  modal('Registrar compra',`<label>Fornecedor<input id="f1"></label>`+
    rowsUI(opts(db.ingredients,i=>`${i.name} (${i.unit})`),'Qtd comprada','Valor total pago (R$)'),()=>{
    const rs=getRows();
    if(!rs.length){alert('Adicione ao menos um item com quantidade.');return false}
    const items=[];let total=0;
    rs.forEach(r=>{
      const i=db.ingredients.find(x=>x.id===r.id);if(!i)return;
      // custo médio ponderado (ignora saldo negativo)
      const old=Math.max(i.qty,0);
      i.cost=(old*i.cost+r.v)/(old+r.q);
      i.qty+=r.q;items.push({name:i.name,q:r.q});total+=r.v;
    });
    db.purchases.push({date:new Date().toLocaleDateString('pt-BR'),sup:$('f1').value.trim()||'-',items,total});
    save();show('buy');
  });
  addRow();
}

/* produtos */
function resize(file,max=700){
  return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;
    r.onload=()=>{const im=new Image();im.onerror=no;
      im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};
      im.src=r.result};r.readAsDataURL(file)});
}
function prod(){
  return `<h2>Produtos de venda</h2><div class="card"><button onclick="prodForm()">+ Produto</button></div>`+
  tbl(['Foto','Produto','Categoria','Preço',''],db.products.map(p=>`<tr><td>${p.img?`<img src="${p.img}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px">`:'—'}</td><td>${esc(p.name)}</td><td>${esc(p.cat||'Geral')}</td><td>${money(p.price)}</td><td><button class="sec" onclick="prodForm(${p.id})">Editar</button></td></tr>`),'Nenhum produto cadastrado.');
}
function prodForm(id){
  const e=db.products.find(x=>x.id===id)||{};
  modal(id?'Editar produto':'Novo produto',`<label>Nome<input id="f1" value="${esc(e.name||'')}"></label>
  <label>Preço de venda (R$)<input id="f2" type="number" min="0" step="any" value="${e.price??0}"></label>
  <label>Categoria (ex.: Lanches, Bebidas)<input id="f3" value="${esc(e.cat||'Geral')}"></label>
  <label>Descrição para o cardápio<input id="f4" value="${esc(e.desc||'')}"></label>
  <label>Foto do prato (opcional)<input id="f5" type="file" accept="image/*"></label>
  ${e.img?'<label><input type="checkbox" id="f6" style="width:auto"> Remover a foto atual</label>':''}
  ${id?`<div class="acts"><button type="button" class="sec" onclick="delProd(${id})">Excluir produto</button></div>`:''}`,()=>{
    const n=$('f1').value.trim();
    if(!n){alert('Informe o nome.');return false}
    if(db.products.some(p=>p.id!==id&&p.name.toLowerCase()===n.toLowerCase())){alert('Já existe um produto com esse nome.');return false}
    const v={name:n,price:num($('f2').value),cat:$('f3').value.trim()||'Geral',desc:$('f4').value.trim()};
    const fl=$('f5').files[0],rm=!!($('f6')&&$('f6').checked);
    const apply=img=>{
      const p=e.id?e:{id:Date.now()};Object.assign(p,v);
      if(img!==undefined){p.img=img;p.url=''}
      if(!e.id)db.products.push(p);
      save();show('prod');
    };
    if(fl)resize(fl).then(apply).catch(()=>{alert('Não foi possível ler a foto.');apply()});
    else apply(rm?'':undefined);
  });
}
function delProd(id){
  if(!confirm('Excluir este produto e a ficha técnica dele?'))return;
  db.products=db.products.filter(p=>p.id!==id);db.recipes=db.recipes.filter(r=>r.pid!==id);
  save();closeM();show('prod');
}

/* ficha técnica */
function recipe(){
  return `<h2>Ficha técnica</h2><div class="card"><button onclick="addRecipe()">+ Ficha</button></div>`+
  tbl(['Produto','Ingredientes'],db.recipes.map(r=>{
    const p=db.products.find(x=>x.id===r.pid);
    return `<tr><td>${esc(p?p.name:r.product)}</td><td>${r.items.map(i=>{
      const g=db.ingredients.find(x=>x.id===i.id);return esc(g?g.name:i.name)+' × '+qfmt(i.q)+' '+esc(g?g.unit:i.unit)}).join(', ')}</td></tr>`}),
    'Nenhuma ficha técnica cadastrada.');
}
function addRecipe(){
  if(!db.products.length||!db.ingredients.length)return alert('Cadastre produtos e ingredientes primeiro.');
  modal('Nova ficha técnica',`<label>Produto<select id="f1">${opts(db.products)}</select></label>
    <p>Quantidade de cada ingrediente por unidade vendida:</p>`+
    rowsUI(opts(db.ingredients,i=>`${i.name} (${i.unit})`),'Qtd por venda'),()=>{
    const rs=getRows();
    if(!rs.length){alert('Adicione ao menos um ingrediente.');return false}
    const pid=+$('f1').value;
    db.recipes=db.recipes.filter(r=>r.pid!==pid); // uma ficha por produto (substitui a anterior)
    const p=db.products.find(x=>x.id===pid);
    db.recipes.push({pid,product:p.name,items:rs.map(r=>{const g=db.ingredients.find(x=>x.id===r.id);return{id:g.id,name:g.name,q:r.q,unit:g.unit}})});
    save();show('recipe');
  });
  addRow();
}

/* vendas */
function sales(){
  return `<h2>Vendas</h2><div class="card"><button onclick="addSale()">+ Nova venda</button></div>`+
  tbl(['Data','Cliente','Itens','Total'],db.sales.map(x=>
    `<tr><td>${esc(x.date)}</td><td>${esc(x.client)}</td><td>${(x.items||[]).map(i=>esc(i.name)+' × '+qfmt(i.q)).join(', ')||'-'}</td><td>${money(x.total)}</td></tr>`),
    'Nenhuma venda registrada.');
}
function addSale(){
  if(!db.products.length)return alert('Cadastre produtos primeiro.');
  modal('Nova venda',`<label>Cliente<input id="f1"></label>`+
    rowsUI(opts(db.products,p=>`${p.name} — ${money(p.price)}`),'Quantidade'),()=>{
    const rs=getRows();
    if(!rs.length){alert('Adicione ao menos um produto com quantidade.');return false}
    // consumo total de ingredientes
    const need={};
    rs.forEach(r=>{
      const rec=db.recipes.find(x=>x.pid===r.id);
      if(rec)rec.items.forEach(it=>{need[it.id]=(need[it.id]||0)+it.q*r.q});
    });
    const lack=Object.keys(need).map(id=>db.ingredients.find(x=>x.id===+id)).filter(i=>i&&i.qty<need[i.id]-1e-9)
      .map(i=>`${i.name}: precisa de ${qfmt(need[i.id])} ${i.unit}, há ${qfmt(i.qty)}`);
    if(lack.length){alert('Estoque insuficiente:\n'+lack.join('\n'));return false}
    let total=0;const items=[];
    rs.forEach(r=>{const p=db.products.find(x=>x.id===r.id);total+=p.price*r.q;items.push({name:p.name,q:r.q,p:p.price})});
    Object.keys(need).forEach(id=>{const i=db.ingredients.find(x=>x.id===+id);if(i)i.qty-=need[id]});
    db.sales.push({date:new Date().toLocaleDateString('pt-BR'),client:$('f1').value.trim()||'-',items,total});
    save();show('sales');
  });
  addRow();
}

/* relatórios e backup */
function report(){
  return `<h2>Relatórios</h2><div class="card">Compras: ${money(sum(db.purchases,x=>x.total))}<br>
  Vendas: ${money(sum(db.sales,x=>x.total))}<br>
  Valor do estoque: ${money(sum(db.ingredients,x=>x.qty*x.cost))}</div>
  <div class="card"><b>Backup dos dados</b><p>Os dados ficam só neste navegador. Exporte um backup com frequência.</p>
  <div class="acts"><button onclick="exportDb()">Exportar backup</button><button class="sec" onclick="$('imp').click()">Importar backup</button></div></div>`;
}
function exportDb(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='delivery-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
$('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Object.keys(empty()).every(k=>Array.isArray(d[k])))throw 0;
      if(!confirm('Isso substitui todos os dados atuais. Continuar?'))return;
      localStorage.setItem(K,JSON.stringify(d));db=load();save();show('report');alert('Backup importado.');
    }catch(err){alert('Arquivo de backup inválido.')}
  };
  r.readAsText(f);e.target.value='';
});

/* ---------- online (Supabase) ---------- */
let SB=JSON.parse(localStorage.getItem('delivery_sb')||'{}'); // url, key, email (a senha nunca é salva)
let TOK='';
async function sb(path,opt={}){
  const r=await fetch(SB.url+'/rest/v1/'+path,{...opt,headers:{apikey:SB.key,...((TOK||SB.key.startsWith('eyJ'))?{Authorization:'Bearer '+(TOK||SB.key)}:{}),'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  return r.status===204?null:r.json().catch(()=>null);
}
function online(){
  if(!TOK){
    return `<h2>Online</h2><div class="card"><p>Conecte ao seu banco (Supabase) para publicar o cardápio e receber pedidos.</p>
    <div class="acts"><button onclick="connect()">Conectar</button></div></div>`;
  }
  setTimeout(loadOrd,0);
  return `<h2>Online</h2><div class="card"><div class="acts" style="margin:0">
    <button onclick="pubMenu()">Publicar cardápio (${db.products.length} produtos)</button>
    <button class="sec" onclick="loadOrd()">Atualizar pedidos</button></div>
    <p style="opacity:.8">Sempre que mudar produtos ou preços, publique de novo. Os clientes usam o arquivo <b>cardapio.html</b> hospedado.</p></div>
    <h3>Pedidos online</h3><div id="ord">Carregando…</div>`;
}
function connect(){
  modal('Conectar ao Supabase',`
  <label>Project URL<input id="s1" value="${esc(SB.url||'')}" placeholder="https://xxxx.supabase.co"></label>
  <label>anon public key<input id="s2" value="${esc(SB.key||'')}"></label>
  <label>E-mail do dono<input id="s3" type="email" value="${esc(SB.email||'')}"></label>
  <label>Senha<input id="s4" type="password"></label>`,()=>{
    SB={url:$('s1').value.trim().replace(/\/$/,''),key:$('s2').value.trim(),email:$('s3').value.trim()};
    const pw=$('s4').value;
    if(!SB.url||!SB.key||!SB.email||!pw){alert('Preencha todos os campos.');return false}
    localStorage.setItem('delivery_sb',JSON.stringify(SB));
    fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:SB.email,password:pw})})
      .then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error_description||j.msg||'Falha no login');TOK=j.access_token;show('online')}))
      .catch(e=>alert('Não foi possível conectar: '+e.message));
  });
}
async function upImg(p){
  const blob=await (await fetch(p.img)).blob();
  const r=await fetch(SB.url+'/storage/v1/object/fotos/'+p.id+'.jpg',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+TOK,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
  if(!r.ok)throw new Error('Foto de "'+p.name+'": '+await r.text());
  p.url=SB.url+'/storage/v1/object/public/fotos/'+p.id+'.jpg?v='+Date.now();
}
async function pubMenu(){
  try{
    for(const p of db.products){if(p.img&&!p.url)await upImg(p)}
    save();
    const rows=db.products.map(p=>({id:p.id,name:p.name,price:p.price,category:p.cat||'Geral',description:p.desc||'',image:p.img?p.url:'',active:true}));
    await sb('products?id=gt.0',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:false})});
    if(rows.length)await sb('products',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
    alert('Cardápio publicado!');
  }catch(e){alert('Erro ao publicar: '+e.message)}
}
async function loadOrd(){
  const el=$('ord');if(!el)return;
  try{
    const o=await sb('orders?select=*&order=id.desc&limit=50');
    el.innerHTML=tbl(['#','Data','Cliente','Itens','Total','Status'],o.map(x=>`<tr><td>${x.id}</td><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td>
      <td>${x.mode==='retirada'?'🛍️ <b>RETIRADA</b> · ':''}${esc(x.client)}<br><small>${esc(x.phone)} · ${esc(x.address||'')} · ${esc(x.payment||'')}${x.notes?' · '+esc(x.notes):''}</small></td>
      <td>${x.items.map(i=>esc(i.name)+' × '+i.q).join(', ')}</td><td>${money(x.total)}<br><small>${x.mode==='retirada'?'Retirada':(x.delivery_fee==null?'Taxa a confirmar':'Entrega '+money(x.delivery_fee)+(x.delivery_km?' · '+x.delivery_km+' km':''))}</small></td>
      <td><select onchange="setSt(${x.id},this.value)">${['novo','preparo','saiu','entregue','cancelado'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select></td></tr>`),
      'Nenhum pedido online ainda.');
  }catch(e){TOK='';el.innerHTML='<div class="card empty">Sessão expirada. Clique em Online e conecte de novo.</div>'}
}
async function setSt(id,s){try{await sb('orders?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s})})}catch(e){alert('Erro ao atualizar o status.')}}

if(sessionStorage.x)enter();
</script>
